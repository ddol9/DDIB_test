spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: ddib-monolith
  datasource:
    url: ${MONOLITH_DB_URL:jdbc:h2:mem:ddib_monolith;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${MONOLITH_DB_USERNAME:sa}
    password: ${MONOLITH_DB_PASSWORD:}
    driver-class-name: ${MONOLITH_DB_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${MONOLITH_JPA_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    show-sql: ${MONOLITH_JPA_SHOW_SQL:false}
  data:
    redis:
      host: ${MONOLITH_REDIS_HOST:localhost}
      port: ${MONOLITH_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${MONOLITH_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${MONOLITH_SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: INFO

